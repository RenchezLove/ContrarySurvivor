; Одежда Т0 (SK_Cloth_T0_Head/Torso/Legs) существует в проекте ТОЛЬКО как мягкие ссылки
; из C++-конструктора (PlayerCharacter.cpp:139-141, ADR-042), BP их не переопределяет —
; сборщик зависимостей cook такие ссылки не видит, и в Android-паке этапа G мешей не было
; (0 строк SK_Cloth_* в Manifest_UFSFiles_Android.txt -> белый манекен на телефоне).
; Принудительный cook папки одежды: свойство сверено с UE 5.5
; (ProjectPackagingSettings.h:582-586 — «cooked regardless of whether they're referenced»).
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Shared/Clothing")
; Иконки предметов (T_Item_*, волна Build 1.2.2) — та же болезнь, что у одежды Т0: на них
; ссылаются только мягкие ссылки из C++ (AArmorTiers.cpp, AAmmoItem.cpp, AConsumableItem.cpp,
; AMeleeWeapon.cpp, APistol.cpp, AQuestItem.cpp, TouchControlsWidget.h), сборщик зависимостей
; их не видит. Пруф пропажи: в пакете 22:30 строк T_Item_ в Manifest_UFSFiles_Android.txt = 0,
; на телефоне инвентарь, магазин и кнопки управления были без картинок (проверил Ринат).
+DirectoriesToAlwaysCook=(Path="/Game/UI/Icons")
; Анимации гуманоида (волна Build 1.2.2, третий случай той же болезни): смерть
; Anim_Death_Humanoid и монтажи AM_FirePistol / AM_MeleeSlash подключены ТОЛЬКО мягкими
; ссылками из C++ (MasterHumanoidCharacter.h:84, 90, 101), BP их не переопределяет.
; Пруф пропажи: в пакете 02.08 22:36 строк Anim_Death_Humanoid, AM_FirePistol, AM_MeleeSlash,
; Anim_FirePistol_Humanoid и Anim_MeleeSlash_Humanoid в Manifest_UFSFiles_Android.txt = 0 —
; на телефоне не падали ни бандиты, ни игрок, не было отдачи при выстреле и взмаха ножом.
; Подпапка Montages подхватывается сама: движок обходит папку РЕКУРСИВНО
; (CookOnTheFlyServer.cpp:9535, IFileManager::FindFilesRecursive).
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Shared/Humanoid")
+CulturesToStage=ru

; Штатная локализация (ADR-050). Путь к цели сбора Game — движок читает его
; отсюда: FPaths::GetGameLocalizationPaths (Paths.cpp:748-767) берёт массив
; LocalizationPaths из секции Internationalization файла DefaultGame.ini.
; Родной язык проекта (ru) задан в Config/Localization/Game.ini -> NativeCulture
; и попадает в Game.locmeta при сборе.
[Internationalization]
+LocalizationPaths=%GAMEDIR%Content/Localization/Game
