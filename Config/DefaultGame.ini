; Одежда Т0 (SK_Cloth_T0_Head/Torso/Legs) существует в проекте ТОЛЬКО как мягкие ссылки
; из C++-конструктора (PlayerCharacter.cpp:139-141, ADR-042), BP их не переопределяет —
; сборщик зависимостей cook такие ссылки не видит, и в Android-паке этапа G мешей не было
; (0 строк SK_Cloth_* в Manifest_UFSFiles_Android.txt -> белый манекен на телефоне).
; Принудительный cook папки одежды: свойство сверено с UE 5.5
; (ProjectPackagingSettings.h:582-586 — «cooked regardless of whether they're referenced»).
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Shared/Clothing")
; Музыка меню паузы (трек «The Zone», волна 08-09 вечер) — та же болезнь: ссылка на трек
; мягкая (грузится в момент открытия паузы), поэтому упаковщик её не видит и звук в пакет
; не попадает. Подтверждено фактом: в собранном пакете 08-09 в Content/Audio лежала только
; папка Demo, Music отсутствовала, а игра писала в журнал «трек паузы не загрузился».
+DirectoriesToAlwaysCook=(Path="/Game/Audio/Music")
; Иконки предметов (T_Item_*, волна Build 1.2.2) — та же болезнь, что у одежды Т0: на них
; ссылаются только мягкие ссылки из C++ (AArmorTiers.cpp, AAmmoItem.cpp, AConsumableItem.cpp,
; AMeleeWeapon.cpp, APistol.cpp, AQuestItem.cpp, TouchControlsWidget.h), сборщик зависимостей
; их не видит. Пруф пропажи: в пакете 22:30 строк T_Item_ в Manifest_UFSFiles_Android.txt = 0,
; на телефоне инвентарь, магазин и кнопки управления были без картинок (проверил Ринат).
+DirectoriesToAlwaysCook=(Path="/Game/UI/Icons")
; Анимации гуманоида (волна Build 1.2.2, третий случай той же болезни): смерть
; Anim_Death_Humanoid и монтажи AM_FirePistol / AM_MeleeSlash подключены ТОЛЬКО мягкими
; ссылками из C++ (MasterHumanoidCharacter.h:84, 90, 101), BP их не переопределяет.
; Пруф пропажи: в пакете 02.08 22:36 строк Anim_Death_Humanoid, AM_FirePistol, AM_MeleeSlash,
; Anim_FirePistol_Humanoid и Anim_MeleeSlash_Humanoid в Manifest_UFSFiles_Android.txt = 0 —
; на телефоне не падали ни бандиты, ни игрок, не было отдачи при выстреле и взмаха ножом.
; Подпапка Montages подхватывается сама: движок обходит папку РЕКУРСИВНО
; (CookOnTheFlyServer.cpp:9535, IFileManager::FindFilesRecursive).
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Shared/Humanoid")
+CulturesToStage=ru

; Штатная локализация (ADR-050). Путь к цели сбора Game — движок читает его
; отсюда: FPaths::GetGameLocalizationPaths (Paths.cpp:748-767) берёт массив
; LocalizationPaths из секции Internationalization файла DefaultGame.ini.
; Родной язык проекта (ru) задан в Config/Localization/Game.ini -> NativeCulture
; и попадает в Game.locmeta при сборе.
[Internationalization]
+LocalizationPaths=%GAMEDIR%Content/Localization/Game

; Кнопка «Написать мне» на карточке конца сюжета (поправка Рината: кнопку оставляем).
; Впишите сюда адрес канала — кнопка начнёт открывать его в браузере. Пока строка пуста,
; кнопка показывает надпись «Канал скоро появится», как и раньше.
; Менять можно текстовым редактором: пересобирать код и заново готовить контент не нужно,
; достаточно заново упаковать игру.
; Пример: ChannelUrl="https://t.me/имя_канала"
; ⛔ АДРЕС ТОЛЬКО В КАВЫЧКАХ: без них движок обрезает строку на двойном слэше и в игру
; приезжает «https:» (ConfigCacheIni.cpp:1776-1780 движка 5.5, проверено живьём 08-09).
[/Script/ContrarySurvivor.EndOfStorySettings]
ChannelUrl="https://t.me/marevogame"

; Б6 (задание издателя ADR-059): согласие на обработку данных и политика конфиденциальности.
; Впишите сюда адрес страницы с политикой — строка «Политика конфиденциальности» на экране
; согласия и в меню паузы начнёт открывать её в браузере. Пока строка пуста, нажатие ничего
; не делает и пустую страницу игроку не показывает.
; Менять можно текстовым редактором: пересобирать код не нужно, достаточно заново упаковать игру.
; Пример: PrivacyPolicyUrl=https://renchezlove.github.io/ContrarySurvivor/privacy.html
;
; bAskConsentOnFirstLaunch — спрашивать ли согласие при первом запуске. В боевой сборке
; ОБЯЗАН быть True: издатель требует не ставить согласие за игрока (условие по РИ-30).
[/Script/ContrarySurvivor.DataConsentSettings]
PrivacyPolicyUrl=
bAskConsentOnFirstLaunch=True

; Главное меню (ADR-062): пункт «Сообщество» ведёт в наш Telegram.
; Впишите сюда адрес — пункт сам появится в меню. Пока строка пуста, пункт спрятан целиком.
; Менять можно текстовым редактором: пересобирать код не нужно, достаточно заново упаковать игру.
; Пример: CommunityUrl=https://t.me/имя_сообщества
;
; BugReportUrl — адрес для пункта «Сообщить об ошибке» на экране настроек (та же волна меню,
; подход 2). Заполнять его НЕОБЯЗАТЕЛЬНО: канал у нас один, и пока эта строка пуста, отчёты
; об ошибках уходят по адресу CommunityUrl выше. Строка оставлена как дверь на будущее — если
; издатель заведёт отдельный чат под ошибки, достаточно вписать его сюда. Пункт на экране
; настроек спрятан целиком, только когда пусты ОБЕ строки.
[/Script/ContrarySurvivor.MainMenuSettings]
; Адрес канала игры дал Ринат 2026-08-09. Пункт «Сообщество» в главном меню появляется
; сам, как только эта строка непустая — пересборка кода не нужна.
; ⛔ АДРЕС ОБЯЗАТЕЛЬНО В КАВЫЧКАХ. Без них движок обрезает строку на двойном слэше и в игру
; приезжает «https:» — Ринат поймал это живьём 08-09. Причина в исходнике движка 5.5
; (ConfigCacheIni.cpp:1776-1780): незакавыченный «//» считается началом комментария.
CommunityUrl="https://t.me/marevogame"
BugReportUrl=
