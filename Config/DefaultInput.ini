; ОТЛАДОЧНЫЕ КЛАВИШИ (только рабочие сборки; в Shipping обработчиков нет — CONTRARY_WITH_QA_CHEATS).
; Биндятся в AContrarySurvivorPlayerController::SetupInputComponent (legacy ActionMapping, без IA/IMC).
; 2026-08-15 (Ринат): оставлен только набор для съёмки. F2/F3/F4/F6/F7/F9/F10/F12, C/X/Z/M/V/J/H/B/N/P/O/F
; и запятая УБРАНЫ вместе с обработчиками. F5/F8/F11 не занимаем (вьюмод / eject / fullscreen).
; F1 — свободная камера (наш AContraryDebugCameraController: без надписей и линий на экране,
; без смены вьюмода; F1 повторно — назад к игроку).
+ActionMappings=(ActionName="QAToggleDebugCam",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=F1)
; K — +100 денег (K, а не F5: F5 в PIE — движковый вьюмод Shader Complexity).
+ActionMappings=(ActionName="QAGiveMoney",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=K)
; T — god-mode (неуязвимость + заморозка голода/жажды). Экранную панель отладки НЕ включает.
+ActionMappings=(ActionName="QAGodMode",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=T)
; Дебаг-клавиши Рината (2026-08-14): G — снимок ИГРОВОЙ ОБЛАСТИ (вьюпорт + интерфейс, без окна
; редактора) в папку на рабочем столе; Y — здоровье/голод/жажда на максимум; U — заморозить/разморозить всех врагов.
+ActionMappings=(ActionName="QAScreenshot",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=G)
+ActionMappings=(ActionName="QAFullStats",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Y)
+ActionMappings=(ActionName="QAFreezeEnemies",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=U)
; Дебаг-клавиша Рината (2026-08-15): Period (точка) — тумблер надписей «Preview» в тенях
; непостроенного света (крутит ShowFlag.PreviewShadowsIndicator: 0 скрыть / 2 умолчание).
+ActionMappings=(ActionName="QATogglePreviewShadows",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Period)
; #26 Экран смерти: возрождение по кнопке «Возродиться» дублируется клавишами (CU-мышь по HUD
