+ActionMappings=(ActionName="Respawn",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Enter)
+ActionMappings=(ActionName="Respawn",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=SpaceBar)
+ActionMappings=(ActionName="Respawn",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Gamepad_FaceButton_Bottom)
; Фаза 5 — слайдер количества купли-продажи в магазине (STALKER 2-стиль). ±количество:
; стрелки Left/Right и колесо мыши = ±1; с Shift = ±10 (детект Shift в обработчике).
; Действуют только при открытом магазине с активным слайдером (gate bShopOpen+IsShopSliderActive);
; вне магазина безвредны (движение — WASD через Enhanced Input, при открытом магазине подавлено).
+ActionMappings=(ActionName="ShopQtyDec",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Left)
+ActionMappings=(ActionName="ShopQtyDec",bShift=True,bCtrl=False,bAlt=False,bCmd=False,Key=Left)
+ActionMappings=(ActionName="ShopQtyDec",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=MouseScrollDown)
+ActionMappings=(ActionName="ShopQtyDec",bShift=True,bCtrl=False,bAlt=False,bCmd=False,Key=MouseScrollDown)
+ActionMappings=(ActionName="ShopQtyInc",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Right)
+ActionMappings=(ActionName="ShopQtyInc",bShift=True,bCtrl=False,bAlt=False,bCmd=False,Key=Right)
+ActionMappings=(ActionName="ShopQtyInc",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=MouseScrollUp)
+ActionMappings=(ActionName="ShopQtyInc",bShift=True,bCtrl=False,bAlt=False,bCmd=False,Key=MouseScrollUp)
; Этап G — меню паузы (меню-минимум: пауза + «Продолжить» + «Выход»). Биндится в
; AContrarySurvivorPlayerController::SetupInputComponent с bExecuteWhenPaused=true (иначе при
; поставленной паузе клавиша закрытия не сработала бы). Escape — стандарт для упакованной игры
; (в PIE Escape завершает саму PIE-сессию, для теста в PIE пользоваться L); L — свободная буква
; (не конфликтует с остальными привязками этого файла); Android_Back — системная «назад» на телефоне.
+ActionMappings=(ActionName="PauseMenu",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Escape)
+ActionMappings=(ActionName="PauseMenu",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=L)
+ActionMappings=(ActionName="PauseMenu",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Android_Back)
; Этап G — тап по экрану Android (ScreenTap). Тач НЕ порождает клик мыши для игрового ввода
; (порождает клавиши Touch1..Touch3, PlayerInput.cpp:473), а IA_Fire в IMC_Default привязан
; только к ЛКМ — поэтому тап заводится в тот же Fire()-путь легаси-привязкой (выбор цели,
; выстрел, клики по Canvas-HUD; позиция тапа = кеш курсора вьюпорта, SceneViewport.cpp:842).
; Touch2/Touch3 нужны для мультитача: пока один палец держит стик/кнопку, тап второго пальца
; приходит уже как Touch2. На ПК Touch-клавиши не генерятся — путь мыши не задет.
+ActionMappings=(ActionName="ScreenTap",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Touch1)
+ActionMappings=(ActionName="ScreenTap",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Touch2)
+ActionMappings=(ActionName="ScreenTap",bShift=False,bCtrl=False,bAlt=False,bCmd=False,Key=Touch3)
