; Опыт по кадрам (2026-08-05): замер на телефоне показал упор почти целиком в видеочип
; (GPU), процессорная часть простаивает. Самый дешёвый рычаг — снизить разрешение отрисовки.
; Профиль "Android" в BaseDeviceProfiles.ini (движковое умолчание) — корень, от которого
; наследуют все Android-профили (Android_Adreno6xx, Android_Mid и т.д.), поэтому override
; здесь действует на все устройства сразу. Это ОПЫТ, не решение — нужны числа "было/стало"
; на одном месте на живом телефоне.
[Android DeviceProfile]
DeviceType=Android
BaseProfileName=

+CVars=r.MobileContentScaleFactor=0.8
