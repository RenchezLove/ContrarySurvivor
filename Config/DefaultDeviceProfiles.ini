; Опыт по кадрам (2026-08-05): замер на живом телефоне показал упор почти целиком в видеочип
; (в деревне время кадра 43,8 мс при видеочипе 43,2; игровая логика 8,3; отрисовка 8,4).
; Значит резать надо нагрузку на картинку, и самый дешёвый рычаг — разрешение отрисовки.
;
; ⛔ ПОЧЕМУ НЕ КОРНЕВОЙ ПРОФИЛЬ (проверено на устройстве 2026-08-05):
; первая попытка прописала значение в корневой профиль [Android] — и НЕ подействовала.
; В журнале живой игры движок выставил единицу: "Pushing Device Profile CVar:
; [[r.MobileContentScaleFactor:1 -> 1.0]]". Причина: сам движок задаёт этот параметр
; в корневом [Android DeviceProfile] (Engine/Config/BaseDeviceProfiles.ini, строка 856,
; значение 1.0), а телефон Рината выбирает более частный профиль Android_Unknown_Vulkan
; (журнал, строка 669), который наследуется через Android_High. Более близкий профиль
; побеждает корневой, поэтому писать надо именно в те профили, что выбираются реально.
;
; Наследование в движке: Android_Unknown_Vulkan -> Android_High -> Android
; (BaseDeviceProfiles.ini, строки 1212-1214 и 919-921).
;
; Дробное число здесь читает сам движок в игре (FCString::Atof), от локали компьютера это
; НЕ зависит — в отличие от MaxAspectRatio в DefaultEngine.ini, где точка ломала разбор.

[Android_High DeviceProfile]
+CVars=r.MobileContentScaleFactor=0.8

[Android_Unknown_Vulkan DeviceProfile]
+CVars=r.MobileContentScaleFactor=0.8
