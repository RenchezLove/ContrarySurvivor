; === Профили устройств ===
;
; ⛔ ФИКСИРОВАННОГО СНИЖЕНИЯ РАЗРЕШЕНИЯ ЗДЕСЬ БОЛЬШЕ НЕТ (волна «Главное меню» 08-08, подход 2).
; Было: +CVars=r.MobileContentScaleFactor=0.8 в профилях Android_High и Android_Unknown_Vulkan —
; каждый телефон получал замыленную картинку молча, игрока не спрашивая.
; Стало (спека docs/contrary-survivor/glavnoe-menu-spec.md, раздел «Экран настроек»,
; дословно: «Нынешнее фиксированное снижение разрешения в профилях устройств заменяется этим
; механизмом»): масштабом разрешения управляет САМ ИГРОК ползунком 50–100% с шагом 10 на экране
; настроек, а качество картинки выбирает пресет («Низкое»/«Среднее»/«Высокое»/«Авто», при «Авто» —
; по железу устройства). Оба рычага живут в UContrarySurvivorGameUserSettings
; (Source/ContrarySurvivor/Settings/) и применяются штатным механизмом масштабируемости движка.
;
; ПОЧЕМУ НЕЛЬЗЯ ВЕРНУТЬ СТРОКУ СЮДА «ЗАОДНО»: тогда источников снижения разрешения станет два, и
; профиль устройства будет драться с ползунком игрока — игрок ставит 100%, а картинка всё равно
; режется профилем. Ровно этого спека и запрещает («ползунок НЕЗАВИСИМЫЙ от пресета… он управляет
; им сам, а не получает замыленную картинку по умолчанию»).
;
; --- Знание, добытое опытом 2026-08-05 (сохраняем: пригодится, если КОГДА-НИБУДЬ понадобится
; править профили устройств) ---
; Замер на живом телефоне показал упор почти целиком в видеочип (в деревне время кадра 43,8 мс
; при видеочипе 43,2; игровая логика 8,3; отрисовка 8,4) — резать надо нагрузку на картинку,
; и самый дешёвый рычаг именно разрешение отрисовки.
; Писать такие параметры в КОРНЕВОЙ профиль [Android] БЕСПОЛЕЗНО: сам движок задаёт их в
; корневом [Android DeviceProfile] (Engine/Config/BaseDeviceProfiles.ini, строка 856), а телефон
; выбирает более частный профиль (у Рината — Android_Unknown_Vulkan, наследование
; Android_Unknown_Vulkan -> Android_High -> Android, BaseDeviceProfiles.ini строки 1212-1214 и
; 919-921). Более близкий профиль побеждает корневой, поэтому писать надо в реально выбираемые.
; Дробное число здесь читает сам движок в игре (FCString::Atof), от локали компьютера это НЕ
; зависит — в отличие от MaxAspectRatio в DefaultEngine.ini, где точка ломала разбор.
