; Порог отбрасывания теней мелких предметов (r.Shadow.RadiusThreshold).
; Движок не рисует тень предмета, если радиус его границ меньше порог * расстояние до камеры * множитель угла обзора.
; Камера игры стоит далеко (3000) при узком угле 40 градусов, и при пороге движка 0.06 граница выходила около 65:
; торс героя (радиус 106) тень давал, а ноги (55) и голова (22) — нет, герой будто висел в воздухе (замечание Рината 07.10).
; При 0.01 граница около 11 — тень дают все части фигур.

[ShadowQuality@0]
r.Shadow.RadiusThreshold=0.01

[ShadowQuality@1]
r.Shadow.RadiusThreshold=0.01

[ShadowQuality@2]
r.Shadow.RadiusThreshold=0.01

[ShadowQuality@3]
r.Shadow.RadiusThreshold=0.01
