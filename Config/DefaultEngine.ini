; GameUserSettingsClassName (globalconfig), движок грузит его в UEngine::InitializeObjectReferences
; (Private/UnrealEngine.cpp:3320) и создаёт объект этим классом (CreateGameUserSettings, строка 17316).
; После этой строки штатный UGameUserSettings::GetGameUserSettings() отдаёт наш объект.
[/Script/Engine.Engine]
GameUserSettingsClassName=/Script/ContrarySurvivor.ContrarySurvivorGameUserSettings

