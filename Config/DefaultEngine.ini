; === Реклама: Yandex Mobile Ads (Build 1.2.1) ===
; Идентификаторы рекламных мест держим здесь, а не в коде. Сейчас стоит демонстрационный
; идентификатор из документации Яндекса: он отдаёт заглушечный ролик и позволяет проверить
; всю логику до получения боевых ключей. Боевой идентификатор выглядит как R-M-XXXXXX-Y —
; когда издатель его пришлёт, достаточно заменить строку ниже.
; Отдельного «App ID» у Яндекса нет: проверено по байт-коду SDK 8.2.0, в классе YandexAds
; такого метода не существует, а сам SDK опознаёт приложение по идентификатору места.
; Три пустых поля ниже — на случай, если издатель захочет разные места под разные точки
; игры; пустое значение означает «взять общий идентификатор».
; Свойства сверены с Source/ContrarySurvivor/Ads/YandexAdService.h (UPROPERTY(Config)).
[/Script/ContrarySurvivor.YandexAdService]
; Общий идентификатор остаётся демонстрационным НАМЕРЕННО: код берёт его только если точечное
; поле пустое (YandexAdService.cpp, GetAdUnitIdForPlacement), а все четыре точки ниже заполнены
; боевыми. Издатель запретил один общий блок на несколько точек — доход меряется по каждой.
RewardedAdUnitId=demo-rewarded-yandex
; Боевые идентификаторы из рекламного кабинета (сводное ТЗ издателя 13.08.2026, раздел 1.2).
; Номер приложения 19754980 зашит прямо в каждый идентификатор — отдельного поля под него
; у SDK Яндекса нет (см. примечание выше). Формат «Реклама с вознаграждением», In-App Bidding.
; Имена блоков в кабинете: backpack / trader / daily / support (marevo_rewarded_*).
AdUnitIdDeathBackpack=R-M-19754980-1
AdUnitIdShopSellBonus=R-M-19754980-2
AdUnitIdDailyDouble=R-M-19754980-3
; Четвёртая точка показа — окно «Поддержать автора» (задание издателя, решение Рината
; 11.08.2026). Имя строки согласовано с рекламным кабинетом, менять его нельзя.
AdUnitIdSupportAuthor=R-M-19754980-4
; Б6 (задание издателя ADR-059, условие по РИ-30): строки bUserConsent здесь БОЛЬШЕ НЕТ.
; Согласие за игрока не ставится — его спрашивает экран согласия при первом запуске, ответ
; хранится на устройстве и передаётся в SDK при его инициализации. Настройки самого экрана
; и ссылка на политику — в Config/DefaultGame.ini, раздел
; [/Script/ContrarySurvivor.DataConsentSettings].
bEnableSdkLogging=False

; --- Переезд запуска на пустой загрузочный уровень (ADR-067 п.5) ---
; Раньше игра стартовала прямо на игровой карте, поэтому телефон грузил лес и деревню ДО
; главного меню: были слышны птицы, тратились время и батарея. Теперь запуск идёт на пустом
; уровне L_Boot, а мир грузится только после «Продолжить» или «Новая игра».
;
; EditorStartupMap НЕ трогаем: в редакторе Ринат работает на игровой карте, и открываться
; редактор должен на ней же.
;
; Строка GameModeMapPrefixes назначает загрузочному уровню его собственный режим игры —
; без персонажа и без игрового интерфейса. Движок разбирает НАЧАЛО имени карты в
; UGameInstance::CreateGameModeForURL (GameInstance.cpp:1543 движка 5.5), причём ПОСЛЕ
; настроек самого уровня: у L_Boot режим в настройках уровня не задан, значит сработает эта
; строка, а игровая карта L_World_C под начало имени "L_Boot" не подпадает и своё поведение
; сохраняет. Имя поля внутри скобок — GameMode, сверено с движком
; (EngineSettings/Classes/GameMapsSettings.h:56, поле FGameModeName::GameMode).
[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/L_World_C.L_World_C
GameDefaultMap=/Game/Maps/L_Boot.L_Boot
+GameModeMapPrefixes=(Name="L_Boot",GameMode="/Script/ContrarySurvivor.BootGameMode")

