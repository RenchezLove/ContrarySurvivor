r.DefaultFeature.AutoExposure=False

; === Экран настроек (волна «Главное меню» 08-08, подход 2; ADR-062) ===
; Движок должен создавать НАШ класс настроек игрока вместо стандартного: в нём живут пресет
; качества, независимый масштаб разрешения, ограничение кадров, счётчик кадров, громкости,
; чувствительность управления, прозрачность экранных кнопок и вибрация.
