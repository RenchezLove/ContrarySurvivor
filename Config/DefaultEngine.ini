; иконкой стояло ContrarySurvivor. Русское название игры «Марево» утвердил Ринат 2026-08-09.
; ⛔ PackageName при этом НЕ меняется: он уже в магазине и в подписанном пакете.
ApplicationDisplayName=Марево
