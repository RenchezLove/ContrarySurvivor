; Подпись публикационного пакета (Б5/RuStore). Файл ключа и пароль лежат ВНЕ репозитория:
; E:/game-dev-team/keys (та же схема, что у ключей аналитики Б4). Абсолютный путь допустим:
; Path.Combine в UEDeployAndroid.cs:4059 при абсолютном втором аргументе берёт его целиком.
; Пароль (KeyStorePassword=...) в репозиторий НЕ вносить — он добавляется только в сборочную
; копию pack-android перед паком с флагом -distribution; без него дистрибуционный пак честно
; падает с ошибкой «keystore не задан», обычные сборки на подпись не смотрят вовсе.
KeyStore=E:/game-dev-team/keys/contrarysurvivor-release.keystore
KeyAlias=contrarysurvivor
; Предел движка по умолчанию 2.1 (AndroidRuntimeSettings.cpp:24) при экране телефона 720x1600 (2.22)
; даёт чёрную полосу (Б9 задания издателя). Значение — верхняя граница «какие экраны мы держим»,
; 3 покрывает любой существующий телефон с запасом.
; ⛔ ЛОВУШКА, ПРОВЕРЕНО ОПЫТОМ 2026-08-05: ЗДЕСЬ НЕЛЬЗЯ ПИСАТЬ ДРОБНОЕ ЧИСЛО ЧЕРЕЗ ТОЧКУ.
; Сборщик манифеста разбирает это число ПО ЛОКАЛИ КОМПЬЮТЕРА (ConfigHierarchy.cs:601 —
; Single.TryParse без InvariantCulture). На русской локали разделитель дробей — запятая,
; поэтому "2.4" не разбирается, и движок молча подставляет своё запасное 2.1
; (UEDeployAndroid.cs:2672-2675). Ошибки в логе НЕТ, сборка зелёная, а в манифесте остаётся 2.10.
; Целое число разбирается одинаково в любой локали — поэтому здесь только целое.
MaxAspectRatio=3
; Вырез под камеру (Б9). ПРОВЕРЕНО НА ТЕЛЕФОНЕ: одного MaxAspectRatio мало. Телефон сообщает
; экран cur=1600x720, а окно приложения app=1440x720 — Android отрезал 160 точек под вырез,
; потому что разрешение рисовать в область выреза по умолчанию выключено. Отсюда чёрная
; полоса, которая не исчезла даже после починки соотношения сторон.
; Значение уходит в манифест как мета-данные GameActivity (UEDeployAndroid.cs:2995).
; ⚠️ ВМЕСТЕ С ЭТИМ полосы здоровья/голода/жажды надо отодвинуть от края, иначе они уедут
; под глазок камеры (прямое требование издателя в Б9).
bUseDisplayCutout=True
bPackageDataInsideApk=True
bBuildForArm64=True
bBuildForX8664=False
